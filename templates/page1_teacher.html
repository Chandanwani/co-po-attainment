{% extends "base.html" %}

{% block title %}Teacher & Course Information - CO-PO Attainment{% endblock %}

{% block content %}
<div class="container-narrow">
  <div class="card" style="border: 2px solid var(--border-dark); padding: 32px 28px;">
    
    <div style="text-align: center; margin-bottom: 24px;">
      <h1 style="font-size: 22px; font-weight: 700; color: var(--primary);">CO-PO Attainment System</h1>
      <p style="font-size: 13.5px; color: var(--text-muted); margin-top: 4px;">
        Step 1: Faculty &amp; Academic Course Information
      </p>
    </div>

    <div id="error-alert" class="alert alert-error" style="display: none;"></div>

    <form id="teacherForm" onsubmit="handleTeacherSubmit(event)">
      <div class="form-group">
        <label class="form-label" for="faculty_name">
          Faculty Name <span class="required">*</span>
        </label>
        <input 
          type="text" 
          id="faculty_name" 
          name="faculty_name" 
          class="form-control" 
          placeholder="e.g. Dr. Rajesh Sharma"
          value="{{ teacher.faculty_name }}" 
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="subject">
          Subject Name &amp; Code <span class="required">*</span>
        </label>
        <input 
          type="text" 
          id="subject" 
          name="subject" 
          class="form-control" 
          placeholder="e.g. Theory of Computation (CS401)"
          value="{{ teacher.subject }}" 
          required
        >
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label" for="class_name">Class</label>
          <select id="class_name" name="class_name" class="form-control">
            <option value="">-- Select Class --</option>
            <option value="TY" {% if teacher.class_name == 'TY' %}selected{% endif %}>TY</option>
            <option value="SY" {% if teacher.class_name == 'SY' %}selected{% endif %}>SY</option>
            <option value="FY" {% if teacher.class_name == 'FY' %}selected{% endif %}>FY</option>
            <option value="B TECH" {% if teacher.class_name == 'B TECH' %}selected{% endif %}>B TECH</option>
            {% if teacher.class_name and teacher.class_name not in ['TY', 'SY', 'FY', 'B TECH'] %}
            <option value="{{ teacher.class_name }}" selected>{{ teacher.class_name }}</option>
            {% endif %}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="division">Division</label>
          <select id="division" name="division" class="form-control" onchange="updateBatchOptions()">
            <option value="">-- Select Division --</option>
            <option value="All Divisions" {% if teacher.division in ['All Divisions', 'ALL DIVISIONS', 'All'] %}selected{% endif %}>All Divisions</option>
            <option value="A" {% if teacher.division == 'A' %}selected{% endif %}>A</option>
            <option value="B" {% if teacher.division == 'B' %}selected{% endif %}>B</option>
            <option value="C" {% if teacher.division == 'C' %}selected{% endif %}>C</option>
            {% if teacher.division and teacher.division not in ['A', 'B', 'C', 'All Divisions', 'ALL DIVISIONS', 'All'] %}
            <option value="{{ teacher.division }}" selected>{{ teacher.division }}</option>
            {% endif %}
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label" for="semester">Semester</label>
          <select id="semester" name="semester" class="form-control">
            <option value="">-- Select Semester --</option>
            <option value="Semester I" {% if teacher.semester in ['Semester I', 'I'] %}selected{% endif %}>Semester I</option>
            <option value="Semester II" {% if teacher.semester in ['Semester II', 'II'] %}selected{% endif %}>Semester II</option>
            <option value="Semester III" {% if teacher.semester in ['Semester III', 'III'] %}selected{% endif %}>Semester III</option>
            <option value="Semester IV" {% if teacher.semester in ['Semester IV', 'IV'] %}selected{% endif %}>Semester IV</option>
            <option value="Semester V" {% if teacher.semester in ['Semester V', 'V'] %}selected{% endif %}>Semester V</option>
            <option value="Semester VI" {% if teacher.semester in ['Semester VI', 'VI'] %}selected{% endif %}>Semester VI</option>
            <option value="Semester VII" {% if teacher.semester in ['Semester VII', 'VII'] %}selected{% endif %}>Semester VII</option>
            <option value="Semester VIII" {% if teacher.semester in ['Semester VIII', 'VIII'] %}selected{% endif %}>Semester VIII</option>
            {% if teacher.semester and teacher.semester not in ['Semester I', 'Semester II', 'Semester III', 'Semester IV', 'Semester V', 'Semester VI', 'Semester VII', 'Semester VIII', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII'] %}
            <option value="{{ teacher.semester }}" selected>{{ teacher.semester }}</option>
            {% endif %}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="academic_year">Academic Year</label>
          <select id="academic_year" name="academic_year" class="form-control">
            <option value="">-- Select Academic Year --</option>
            <option value="2024-25" {% if teacher.academic_year in ['2024-25', '2024-2025'] %}selected{% endif %}>2024-25</option>
            <option value="2025-26" {% if teacher.academic_year in ['2025-26', '2025-2026'] %}selected{% endif %}>2025-26</option>
            <option value="2026-27" {% if teacher.academic_year in ['2026-27', '2026-2027'] %}selected{% endif %}>2026-27</option>
            <option value="2027-28" {% if teacher.academic_year in ['2027-28', '2027-2028'] %}selected{% endif %}>2027-28</option>
            <option value="2028-29" {% if teacher.academic_year in ['2028-29', '2028-2029'] %}selected{% endif %}>2028-29</option>
            <option value="2029-30" {% if teacher.academic_year in ['2029-30', '2029-2030'] %}selected{% endif %}>2029-30</option>
            {% if teacher.academic_year and teacher.academic_year not in ['2024-25', '2024-2025', '2025-26', '2025-2026', '2026-27', '2026-2027', '2027-28', '2027-2028', '2028-29', '2028-2029', '2029-30', '2029-2030'] %}
            <option value="{{ teacher.academic_year }}" selected>{{ teacher.academic_year }}</option>
            {% endif %}
          </select>
        </div>
      </div>

      <!-- Course Nature / Type Selection (Placed at last, without small info) -->
      <div class="form-group mb-16" style="margin-top: 14px;">
        <label class="form-label" style="font-weight: 700; color: var(--primary);">
          Course Nature / Type <span class="required">*</span>
        </label>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px;">
          <label style="display: flex; align-items: center; gap: 8px; padding: 12px 16px; border: 2px solid {% if teacher.course_type == 'practical' %}#e2e8f0{% else %}var(--primary){% endif %}; border-radius: 8px; cursor: pointer; background: {% if teacher.course_type == 'practical' %}#ffffff{% else %}#eff6ff{% endif %}; font-weight: 700; font-size: 14px;" id="lblTheory">
            <input type="radio" name="course_type" id="course_type_theory" value="theory" {% if teacher.course_type != 'practical' %}checked{% endif %} onchange="onCourseTypeChange()">
            <span>📖 Theory</span>
          </label>
          <label style="display: flex; align-items: center; gap: 8px; padding: 12px 16px; border: 2px solid {% if teacher.course_type == 'practical' %}var(--primary){% else %}#e2e8f0{% endif %}; border-radius: 8px; cursor: pointer; background: {% if teacher.course_type == 'practical' %}#eff6ff{% else %}#ffffff{% endif %}; font-weight: 700; font-size: 14px;" id="lblPractical">
            <input type="radio" name="course_type" id="course_type_practical" value="practical" {% if teacher.course_type == 'practical' %}checked{% endif %} onchange="onCourseTypeChange()">
            <span>🔬 Practical</span>
          </label>
        </div>
      </div>

      <!-- Laboratory Batch (Visible ONLY when Practical is selected AND NOT All Divisions) -->
      <div class="form-group mb-16" id="batchGroup" style="display: {% if teacher.course_type == 'practical' and teacher.division not in ['All Divisions', 'ALL DIVISIONS', 'All'] %}block{% else %}none{% endif %}; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 12px 14px;">
        <label class="form-label" for="batch" style="color: #166534; font-weight: 700;">
          Laboratory Batch <span class="required">*</span>
        </label>
        <div style="display: flex; gap: 10px; align-items: center;">
          <select id="batch" name="batch" class="form-control" style="font-weight: 600; color: #166534;">
            <!-- Populated dynamically based on Division (e.g. A1, A2, A3, A4) -->
          </select>
        </div>
      </div>

      <div style="margin-top: 24px; display: flex; gap: 12px; align-items: center;">
        <button type="submit" id="btnContinue" class="btn btn-primary btn-lg" style="flex: 2;">
          Save &amp; Continue to Assessment Data &rarr;
        </button>
        <button type="button" class="btn btn-outline btn-lg" style="flex: 1; color: #64748b; border-color: #cbd5e1;" onclick="clearTeacherForm()">
          🔄 Clear Form
        </button>
      </div>
    </form>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Check if starting fresh
const urlParams = new URLSearchParams(window.location.search);

function updateBatchOptions(preferredBatch) {
  const isPrac = document.getElementById('course_type_practical') && document.getElementById('course_type_practical').checked;
  const divSelect = document.getElementById('division');
  const divVal = divSelect ? divSelect.value.trim() : '';
  const isAllDivisions = divVal.toUpperCase() === 'ALL DIVISIONS' || divVal.toUpperCase() === 'ALL';
  const batchGroup = document.getElementById('batchGroup');

  // When All Divisions is selected, no need to ask about batch for practical
  if (batchGroup) {
    batchGroup.style.display = (isPrac && !isAllDivisions) ? 'block' : 'none';
  }

  const batchSelect = document.getElementById('batch');
  if (!batchSelect) return;

  if (isAllDivisions) {
    batchSelect.innerHTML = '<option value="All Divisions">All Divisions</option>';
    batchSelect.value = 'All Divisions';
    return;
  }

  const prefix = divVal || 'A';
  const currentVal = preferredBatch || batchSelect.value;

  batchSelect.innerHTML = '';
  
  // Changed to 'Full Division' as requested
  const allOpt = document.createElement('option');
  allOpt.value = 'Full Division';
  allOpt.textContent = 'Full Division';
  batchSelect.appendChild(allOpt);

  [1, 2, 3, 4].forEach(num => {
    const opt = document.createElement('option');
    const code = `${prefix}${num}`;
    opt.value = code;
    opt.textContent = `Batch ${code}`;
    batchSelect.appendChild(opt);
  });

  if (currentVal && Array.from(batchSelect.options).some(o => o.value === currentVal)) {
    batchSelect.value = currentVal;
  } else if (currentVal && (currentVal === 'All Batches' || currentVal.includes('Full Division'))) {
    batchSelect.value = 'Full Division';
  } else if (currentVal) {
    const match = currentVal.match(/\d+/);
    if (match) {
      const converted = `${prefix}${match[0]}`;
      if (Array.from(batchSelect.options).some(o => o.value === converted)) {
        batchSelect.value = converted;
      }
    }
  }
}

function onCourseTypeChange() {
  const isPrac = document.getElementById('course_type_practical') && document.getElementById('course_type_practical').checked;
  const divSelect = document.getElementById('division');
  const divVal = divSelect ? divSelect.value.trim() : '';
  const isAllDivisions = divVal.toUpperCase() === 'ALL DIVISIONS' || divVal.toUpperCase() === 'ALL';
  const batchGroup = document.getElementById('batchGroup');
  const lblTheory = document.getElementById('lblTheory');
  const lblPractical = document.getElementById('lblPractical');

  if (isPrac) {
    if (batchGroup) batchGroup.style.display = isAllDivisions ? 'none' : 'block';
    updateBatchOptions();
    if (lblPractical) {
      lblPractical.style.borderColor = 'var(--primary)';
      lblPractical.style.background = '#eff6ff';
    }
    if (lblTheory) {
      lblTheory.style.borderColor = '#e2e8f0';
      lblTheory.style.background = '#ffffff';
    }
  } else {
    if (batchGroup) batchGroup.style.display = 'none';
    if (lblTheory) {
      lblTheory.style.borderColor = 'var(--primary)';
      lblTheory.style.background = '#eff6ff';
    }
    if (lblPractical) {
      lblPractical.style.borderColor = '#e2e8f0';
      lblPractical.style.background = '#ffffff';
    }
  }
}

function clearTeacherFormQuiet() {
  const fnInp = document.getElementById('faculty_name'); if (fnInp) fnInp.value = '';
  const subInp = document.getElementById('subject'); if (subInp) subInp.value = '';
  const clsInp = document.getElementById('class_name'); if (clsInp) clsInp.value = '';
  const divInp = document.getElementById('division'); if (divInp) divInp.value = '';
  const semInp = document.getElementById('semester'); if (semInp) semInp.value = '';
  const ayInp = document.getElementById('academic_year'); if (ayInp) ayInp.value = '';
  updateBatchOptions();
  const radTh = document.getElementById('course_type_theory'); if (radTh) radTh.checked = true;
  onCourseTypeChange();
  if (typeof clearStoredState === 'function') {
    clearStoredState();
  }
}

function clearTeacherForm() {
  clearTeacherFormQuiet();
  fetch('/api/reset-session', { method: 'POST' }).catch(() => {});
}

// Start fresh by default when landing on the first page
window.addEventListener('DOMContentLoaded', () => {
  updateBatchOptions();
  clearTeacherFormQuiet();
  fetch('/api/reset-session', { method: 'POST' }).catch(() => {});
});

async function handleTeacherSubmit(e) {
  e.preventDefault();
  const alertEl = document.getElementById('error-alert');
  const btn = document.getElementById('btnContinue');
  alertEl.style.display = 'none';

  const faculty_name = document.getElementById('faculty_name').value.trim();
  const subject = document.getElementById('subject').value.trim();

  if (!faculty_name || !subject) {
    alertEl.textContent = 'Please provide both Faculty Name and Subject before continuing.';
    alertEl.style.display = 'block';
    return;
  }

  const isPrac = document.getElementById('course_type_practical') && document.getElementById('course_type_practical').checked;
  const divVal = document.getElementById('division').value.trim();
  const isAllDiv = divVal.toUpperCase() === 'ALL DIVISIONS' || divVal.toUpperCase() === 'ALL';
  const batchVal = isPrac ? (isAllDiv ? 'All Divisions' : (document.getElementById('batch') ? document.getElementById('batch').value : 'Full Division')) : '';

  const payload = {
    faculty_name: faculty_name,
    subject: subject,
    course_type: isPrac ? 'practical' : 'theory',
    batch: batchVal,
    class_name: document.getElementById('class_name').value.trim(),
    division: document.getElementById('division').value.trim(),
    semester: document.getElementById('semester').value.trim(),
    academic_year: document.getElementById('academic_year').value.trim()
  };

  // Persist to local storage immediately
  if (typeof saveStoredState === 'function') {
    saveStoredState({ teacher: payload });
  }

  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    const res = await fetch('/api/save-teacher', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const result = await res.json();
    if (result.success) {
      window.location.href = result.redirect || '/assessment';
    } else {
      alertEl.textContent = result.message || 'An error occurred while saving teacher data.';
      alertEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Save & Continue to Assessment Data →';
    }
  } catch (err) {
    alertEl.textContent = 'Network error: ' + err.message;
    alertEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Save & Continue to Assessment Data →';
  }
}
</script>
{% endblock %}
